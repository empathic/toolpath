# Egress for the act VM: loopback and the hosts in ci/act.lock [egress], nothing else.
# Replay talks to 127.0.0.1 only; no model API host is allowed.
http_port 3128
acl localnet src 127.0.0.1/32
acl allowed_hosts dstdomain index.crates.io static.crates.io
acl CONNECT method CONNECT
http_access allow localnet allowed_hosts
http_access deny all
