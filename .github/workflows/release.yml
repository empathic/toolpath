name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Never cancelled: one group per tag (or dispatched ref) and sha, so a release run always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full quality gates on the tagged commit, the same matrix CI runs (gates.yml): a tag never
  # publishes binaries built from a tree that did not pass them.
  gates:
    uses: ./.github/workflows/gates.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.target }}
    needs: gates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install libssl-dev
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: |
          # musl can't use system libssl (glibc-linked), so it vendors openssl.
          # mac has no system libssl at all; the runner has Homebrew's openssl
          # at /opt/homebrew/opt/openssl@3, but linking against it bakes that
          # absolute path into the binary and end users without Homebrew get
          # dyld errors — so we vendor there too.
          # aarch64-gnu now builds natively on an arm runner — system libssl works.
          extra=()
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ] \
            || [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            extra=(--features vendored-openssl)
          fi
          cargo build --release --target ${{ matrix.target }} -p path-cli --bin path "${extra[@]}"

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../path-${{ matrix.target }}.tar.gz path
          cd ../../..
          sha256sum path-${{ matrix.target }}.tar.gz > path-${{ matrix.target }}.tar.gz.sha256 2>/dev/null || \
            shasum -a 256 path-${{ matrix.target }}.tar.gz > path-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: path-${{ matrix.target }}
          path: |
            path-${{ matrix.target }}.tar.gz
            path-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
