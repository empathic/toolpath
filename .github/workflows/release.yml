name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install libssl-dev
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: |
          # musl can't use system libssl (glibc-linked), so it vendors openssl.
          # mac has no system libssl at all; the runner has Homebrew's openssl
          # at /opt/homebrew/opt/openssl@3, but linking against it bakes that
          # absolute path into the binary and end users without Homebrew get
          # dyld errors — so we vendor there too.
          # aarch64-gnu now builds natively on an arm runner — system libssl works.
          extra=()
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ] \
            || [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            extra=(--features vendored-openssl)
          fi
          cargo build --release --target ${{ matrix.target }} -p path-cli --bin path "${extra[@]}"

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../path-${{ matrix.target }}.tar.gz path
          cd ../../..
          sha256sum path-${{ matrix.target }}.tar.gz > path-${{ matrix.target }}.tar.gz.sha256 2>/dev/null || \
            shasum -a 256 path-${{ matrix.target }}.tar.gz > path-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: path-${{ matrix.target }}
          path: |
            path-${{ matrix.target }}.tar.gz
            path-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
