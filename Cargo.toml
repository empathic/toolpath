[workspace]
members = [
    "crates/toolpath",
    "crates/toolpath-convo",
    "crates/toolpath-git",
    "crates/toolpath-github",
    "crates/toolpath-claude",
    "crates/toolpath-gemini",
    "crates/toolpath-codex",
    "crates/toolpath-copilot",
    "crates/toolpath-opencode",
    "crates/toolpath-cursor",
    "crates/toolpath-dot",
    "crates/toolpath-md",
    "crates/toolpath-pi",
    "crates/pathbase-client",
    "crates/path-cli",
]
exclude = ["crates/toolpath-cli"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
toolpath = { version = "0.7.0", path = "crates/toolpath" }
toolpath-convo = { version = "0.11.1", path = "crates/toolpath-convo" }
toolpath-git = { version = "0.6.0", path = "crates/toolpath-git" }
toolpath-claude = { version = "0.12.3", path = "crates/toolpath-claude", default-features = false }
toolpath-gemini = { version = "0.6.1", path = "crates/toolpath-gemini", default-features = false }
toolpath-codex = { version = "0.6.1", path = "crates/toolpath-codex" }
toolpath-copilot = { version = "0.1.0", path = "crates/toolpath-copilot" }
toolpath-opencode = { version = "0.5.0", path = "crates/toolpath-opencode" }
toolpath-cursor = { version = "0.2.0", path = "crates/toolpath-cursor" }
toolpath-github = { version = "0.6.0", path = "crates/toolpath-github" }
toolpath-dot = { version = "0.5.0", path = "crates/toolpath-dot" }
toolpath-md = { version = "0.7.0", path = "crates/toolpath-md" }
toolpath-pi = { version = "0.6.1", path = "crates/toolpath-pi" }
path-cli = { version = "0.19.0", path = "crates/path-cli" }
pathbase-client = { version = "0.2.0", path = "crates/pathbase-client" }

reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.19"
tokio = { version = "1.40", features = ["full"] }
notify = { version = "7", features = ["macos_kqueue"] }
similar = "2"
tempfile = "3.15"
insta = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
uuid = { version = "1", features = ["serde"] }
toml = "1"

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
