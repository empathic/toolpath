[package]
name = "toolpath-copilot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/empathic/toolpath"
description = "Derive Toolpath provenance documents from GitHub Copilot CLI session logs (preview; schema reverse-engineered)"
keywords = ["copilot", "provenance", "toolpath", "audit", "ai"]
categories = ["development-tools"]
exclude = ["**/.qual"]

[dependencies]
toolpath = { workspace = true }
toolpath-convo = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
tempfile = { workspace = true }
