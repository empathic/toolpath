[package]
name = "toolpath-amp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/empathic/toolpath"
description = "Derive Toolpath provenance documents from Amp (ampcode.com) thread exports (preview; schema reverse-engineered)"
keywords = ["amp", "provenance", "toolpath", "audit", "ai"]
categories = ["development-tools"]

[dependencies]
toolpath = { workspace = true }
toolpath-convo = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
jsonschema = { version = "0.46", default-features = false }
