[package]
name = "path-cli"
version = "0.17.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/empathic/toolpath"
description = "CLI for deriving, querying, and visualizing Toolpath provenance (binary: path)"
keywords = ["provenance", "toolpath", "cli", "audit", "traceability"]
categories = ["command-line-utilities", "development-tools"]
default-run = "path"

[lib]
name = "path_cli"
path = "src/lib.rs"

[[bin]]
name = "path"
path = "src/main.rs"

[[bin]]
name = "gen_synthetic_path"
path = "src/bin/gen_synthetic_path.rs"

[dependencies]
toolpath = { workspace = true }
toolpath-git = { workspace = true }
toolpath-dot = { workspace = true }
toolpath-md = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
rand = "0.9"
jsonschema = { version = "0.46", default-features = false }
sha2 = "0.10"
hex = "0.4"
jaq-core = "3.1.0"
jaq-std = "3.0.1"
jaq-json = "2.0.1"

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
toolpath-claude = { workspace = true, features = ["watcher"] }
toolpath-gemini = { workspace = true, features = ["watcher"] }
toolpath-codex = { workspace = true }
toolpath-copilot = { workspace = true }
toolpath-opencode = { workspace = true }
toolpath-cursor = { workspace = true }
toolpath-pi = { workspace = true }
toolpath-convo = { workspace = true }
toolpath-github = { workspace = true }
pathbase-client = { workspace = true }
git2 = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
# Native fuzzy picker (crates/path-cli/src/tui/) — used when external
# `fzf` isn't on PATH (and by default even when it is). Gated by the
# `embedded-picker` feature (enabled by default) so downstream
# packagers who want a smaller binary can opt out.
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
nucleo-matcher = { version = "0.3", optional = true }
ansi-to-tui = { version = "8", optional = true }
# Grapheme iteration for match-highlight rendering: nucleo builds its
# haystacks by grapheme segmentation, so highlight indices are grapheme
# positions and the renderer must segment identically. Already in the
# tree transitively (nucleo-matcher, ratatui).
unicode-segmentation = { version = "1.13.2", optional = true }

[target.'cfg(target_os = "emscripten")'.dependencies]
toolpath-claude = { workspace = true }
toolpath-gemini = { workspace = true }
toolpath-codex = { workspace = true }
toolpath-copilot = { workspace = true }
toolpath-pi = { workspace = true }

[features]
default = ["embedded-picker"]
vendored-openssl = ["git2/vendored-openssl"]
# Ship the built-in native picker so `path share` / `path resume` /
# `path p import` work in interactive flows even when external `fzf`
# isn't on PATH. Turn off (`--no-default-features`) for the minimal
# build (external `fzf` then becomes the only interactive backend).
embedded-picker = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:nucleo-matcher",
    "dep:ansi-to-tui",
    "dep:unicode-segmentation",
]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { workspace = true }
toolpath-convo = { workspace = true }
# PTY harness for the opt-in (#[ignore]) native-picker smoke tests in
# tests/picker_pty.rs — the only way to exercise the real TTY event
# loop end to end.
portable-pty = "0.9"
