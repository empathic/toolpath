[package]
name = "toolpath-antigravity"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/empathic/toolpath"
description = "Derive Toolpath provenance documents from Antigravity CLI (agy) conversation stores"
keywords = ["antigravity", "gemini", "provenance", "toolpath", "audit"]
categories = ["development-tools"]
exclude = ["**/.qual"]

[dependencies]
toolpath = { workspace = true }
toolpath-convo = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toolpath-claude = { workspace = true }
