[package]
name = "toolpath-cursor"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/empathic/toolpath"
description = "Derive Toolpath provenance documents from Cursor's bubble store and agent transcripts"
keywords = ["cursor", "provenance", "toolpath", "audit", "ai"]
categories = ["development-tools"]
exclude = ["**/.qual"]

[dependencies]
toolpath = { workspace = true }
toolpath-convo = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
sha2 = "0.10"
md5 = "0.8"
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
