[package]
name = "toolpath-goldens"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/empathic/toolpath"
description = "Goldens as insta snapshots: one pure pipeline over each input transcript, one snapshot per stage"
publish = false

[dependencies]
toolpath = { workspace = true }
toolpath-convo = { workspace = true }
toolpath-claude = { workspace = true }
toolpath-codex = { workspace = true }
toolpath-copilot = { workspace = true }
toolpath-pi = { workspace = true }
toolpath-gemini = { workspace = true }
toolpath-opencode = { workspace = true }
toolpath-cursor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The validator `path p validate` uses, at the same version as path-cli.
jsonschema = { version = "0.46", default-features = false }
sha2 = "0.10"
# JSON Schemas of the baseline's snapshot kinds (src/schemas.rs, docs/baseline/schemas/).
schemars = "0.8"
hex = "0.4"
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
insta = { workspace = true, features = ["json", "glob", "redactions"] }
# tests/opencode_db.rs builds an opencode-stable.db to read through the adapter.
rusqlite = { workspace = true }
